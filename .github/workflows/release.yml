name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # Setup pnpm
      # ==========================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ==========================================================
      # Setup Node.js
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # ==========================================================
      # Install dependencies
      # ==========================================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================================
      # Setup Rust
      # ==========================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ==========================================================
      # Rust cache
      # ==========================================================
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      # ==========================================================
      # Generate changelog
      # ==========================================================
      - name: Generate changelog
        shell: bash
        run: |
          set -e

          TAG="${GITHUB_REF_NAME}"

          echo "Current tag: ${TAG}"

          # ------------------------------------------------------
          # Find previous v* tag
          # ------------------------------------------------------
          PREVIOUS_TAG=$(
            git tag --sort=-version:refname \
              | grep '^v' \
              | grep -v "^${TAG}$" \
              | head -n 1 \
              || true
          )

          echo "Previous tag: ${PREVIOUS_TAG}"

          # ------------------------------------------------------
          # Determine commit range
          # ------------------------------------------------------
          if [ -n "${PREVIOUS_TAG}" ]; then
            RANGE="${PREVIOUS_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          echo "Commit range: ${RANGE}"

          # ------------------------------------------------------
          # Generate changelog
          # ------------------------------------------------------
          {
            echo "# ${TAG}"
            echo

            # ----------------------------------------------------
            # Features
            # ----------------------------------------------------
            echo "## ✨ Features"
            echo

            git log "${RANGE}" \
              --pretty=format:'- %s (%h)' \
              | grep -E '^- feat(\(.+\))?:' \
              || true

            echo

            # ----------------------------------------------------
            # Bug Fixes
            # ----------------------------------------------------
            echo "## 🐛 Bug Fixes"
            echo

            git log "${RANGE}" \
              --pretty=format:'- %s (%h)' \
              | grep -E '^- fix(\(.+\))?:' \
              || true

            echo

            # ----------------------------------------------------
            # Documentation
            # ----------------------------------------------------
            echo "## 📚 Documentation"
            echo

            git log "${RANGE}" \
              --pretty=format:'- %s (%h)' \
              | grep -E '^- docs(\(.+\))?:' \
              || true

            echo

            # ----------------------------------------------------
            # Refactoring
            # ----------------------------------------------------
            echo "## ♻️ Refactoring"
            echo

            git log "${RANGE}" \
              --pretty=format:'- %s (%h)' \
              | grep -E '^- refactor(\(.+\))?:' \
              || true

            echo

            # ----------------------------------------------------
            # Performance
            # ----------------------------------------------------
            echo "## ⚡ Performance"
            echo

            git log "${RANGE}" \
              --pretty=format:'- %s (%h)' \
              | grep -E '^- perf(\(.+\))?:' \
              || true

            echo

            # ----------------------------------------------------
            # Tests
            # ----------------------------------------------------
            echo "## 🧪 Tests"
            echo

            git log "${RANGE}" \
              --pretty=format:'- %s (%h)' \
              | grep -E '^- test(\(.+\))?:' \
              || true

            echo

            # ----------------------------------------------------
            # Chores
            # ----------------------------------------------------
            echo "## 🔧 Chores"
            echo

            git log "${RANGE}" \
              --pretty=format:'- %s (%h)' \
              | grep -E '^- chore(\(.+\))?:' \
              || true

            echo

            # ----------------------------------------------------
            # Other
            # ----------------------------------------------------
            echo "## 📝 Other Changes"
            echo

            git log "${RANGE}" \
              --pretty=format:'- %s (%h)' \
              | grep -Ev \
                '^- (feat|fix|docs|refactor|perf|test|chore)(\(.+\))?:' \
              || true

            echo

          } > CHANGELOG.md

          echo ""
          echo "========================================"
          echo "CHANGELOG"
          echo "========================================"
          cat CHANGELOG.md

      # ==========================================================
      # Determine prerelease
      # ==========================================================
      - name: Determine release type
        id: release-type
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "${TAG}" == *"-pre"* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "Release type: PREVIEW"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "Release type: STABLE"
          fi

      # ==========================================================
      # Build Tauri + create GitHub Release
      #
      # Tauri will:
      #   - build Windows installer
      #   - generate updater artifact
      #   - generate .sig
      #   - generate latest.json
      #   - upload artifacts to GitHub Release
      # ==========================================================
      - name: Build and publish Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ------------------------------------------------------
          # Tauri updater signing private key
          # ------------------------------------------------------
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          # ------------------------------------------------------
          # Use the tag that triggered this workflow
          # ------------------------------------------------------
          tagName: ${{ github.ref_name }}

          # ------------------------------------------------------
          # Release name
          # ------------------------------------------------------
          releaseName: "Release ${{ github.ref_name }}"

          # ------------------------------------------------------
          # Create as draft first.
          #
          # We will add our generated CHANGELOG afterwards
          # and then publish the release.
          # ------------------------------------------------------
          releaseDraft: true

          # ------------------------------------------------------
          # Preview / stable
          # ------------------------------------------------------
          prerelease: ${{ steps.release-type.outputs.prerelease }}

          # ------------------------------------------------------
          # Tauri build target
          # ------------------------------------------------------
          args: "--target x86_64-pc-windows-msvc"

      # ==========================================================
      # Replace Release notes with our changelog
      # ==========================================================
      - name: Update release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md

      # ==========================================================
      # Publish Release
      # ==========================================================
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.release-type.outputs.prerelease }}" == "true" ]]; then
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=false \
              --prerelease=true
          else
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=false \
              --prerelease=false
          fi

      # ==========================================================
      # Show final release information
      # ==========================================================
      - name: Release summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================"
          echo "Release completed"
          echo "========================================"
          echo "Tag: ${GITHUB_REF_NAME}"
          echo ""

          gh release view "${GITHUB_REF_NAME}"
