name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      # ==========================================================
      # Setup pnpm
      # ==========================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ==========================================================
      # Setup Node.js
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # ==========================================================
      # Install dependencies
      # ==========================================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================================
      # Sync version from Git Tag to package.json and tauri.conf.json
      # ==========================================================
      - name: Update version from tag
        shell: bash
        run: |
          set -e
          # 提取纯版本号 (去掉前缀 'v')
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating files to version: ${VERSION}"

          # 使用 Node.js 修改 package.json
          node -e "
            const fs = require('fs');
            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "

          # 使用 Node.js 修改 src-tauri/tauri.conf.json
          node -e "
            const fs = require('fs');
            const confPath = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = '${VERSION}';
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
          "

          echo "Version successfully updated in package.json and src-tauri/tauri.conf.json"

      # ==========================================================
      # Setup Rust
      # ==========================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ==========================================================
      # Rust cache
      # ==========================================================
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      # ==========================================================
      # Determine channel and find previous tag
      # ==========================================================
      - name: Determine channel and previous tag
        id: channel
        shell: bash
        run: |
          set -e

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          echo "Current tag: ${TAG}"
          echo "Current version: ${VERSION}"

          if echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+'; then
            CHANNEL="preview"
          else
            CHANNEL="stable"
          fi

          echo "Channel: ${CHANNEL}"
          echo "channel=${CHANNEL}" >> "${GITHUB_OUTPUT}"

          PREVIOUS_TAG=""

          if [ "${CHANNEL}" = "stable" ]; then
            PREVIOUS_TAG=$(
              git tag --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | grep -v "^${TAG}$" \
                | head -n 1 \
                || true
            )
          else
            PREVIOUS_TAG=$(
              git tag --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-.+$' \
                | grep -v "^${TAG}$" \
                | head -n 1 \
                || true
            )
          fi

          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"
          echo "previous_tag=${PREVIOUS_TAG}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Generate changelog
      # ==========================================================
      - name: Generate changelog
        shell: bash
        run: |
          set -e

          TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="${{ steps.channel.outputs.previous_tag }}"

          echo "Current tag: ${TAG}"
          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"

          if [ -n "${PREVIOUS_TAG}" ]; then
            RANGE="${PREVIOUS_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          echo "Commit range: ${RANGE}"

          {
            echo "# ${TAG}"
            echo

            echo "## ✨ Features"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- feat(\(.+\))?:' || true
            echo

            echo "## 🐛 Bug Fixes"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- fix(\(.+\))?:' || true
            echo

            echo "## 📚 Documentation"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- docs(\(.+\))?:' || true
            echo

            echo "## ♻️ Refactoring"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- refactor(\(.+\))?:' || true
            echo

            echo "## ⚡ Performance"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- perf(\(.+\))?:' || true
            echo

            echo "## 🧪 Tests"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- test(\(.+\))?:' || true
            echo

            echo "## 🔧 Chores"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- chore(\(.+\))?:' || true
            echo

            echo "## 📝 Other Changes"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- (feat|fix|docs|refactor|perf|test|chore)(\(.+\))?:' -v || true
            echo

          } > CHANGELOG.md

          echo ""
          echo "========================================"
          echo "CHANGELOG"
          echo "========================================"
          cat CHANGELOG.md

      # ==========================================================
      # Determine prerelease
      # ==========================================================
      - name: Determine release type
        id: release-type
        shell: bash
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"

          if [ "${CHANNEL}" = "preview" ]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "Release type: PREVIEW"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "Release type: STABLE"
          fi

      # ==========================================================
      # Build Tauri + create GitHub Release
      # ==========================================================
      - name: Build and publish Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          args: "--target x86_64-pc-windows-msvc"

      # ==========================================================
      # Upload CHANGELOG.md as release asset
      # ==========================================================
      - name: Upload CHANGELOG.md
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            CHANGELOG.md \
            --clobber

      # ==========================================================
      # Replace Release notes with our changelog
      # ==========================================================
      - name: Update release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md

      # ==========================================================
      # Publish Release
      # ==========================================================
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.release-type.outputs.prerelease }}" == "true" ]]; then
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=false \
              --prerelease=true
          else
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=false \
              --prerelease=false
          fi

      # ==========================================================
      # Show final release information
      # ==========================================================
      - name: Release summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================"
          echo "Release completed"
          echo "========================================"
          echo "Tag: ${GITHUB_REF_NAME}"
          echo "Channel: ${{ steps.channel.outputs.channel }}"
          echo ""

          gh release view "${GITHUB_REF_NAME}"
